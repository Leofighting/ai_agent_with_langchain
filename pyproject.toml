[project]
name = "ai-agent-with-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "janic", email = "469342045@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "openai>=3.14.1",
    "pydantic>=2.13.5",
]

[project.scripts]
ai-agent-with-langchain = "ai_agent_with_langchain:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
